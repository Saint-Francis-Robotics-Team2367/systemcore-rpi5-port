# CAN bus mode is configurable per bus via /etc/can_bus_mode.
# Default: classic CAN at 1Mbps for USB adapters (works with every CAN
# device); CAN FD 1Mbps/2Mbps for the Waveshare 2-CH CAN FD HAT.
#
# Waveshare 2-CH CAN FD HAT (2x MCP2518FD on SPI, mcp251xfd driver):
# channels are pinned to can_s0 (CAN_0, spi0.0) and can_s1 (CAN_1, spi1.0
# in the default dual-SPI "A" mode, spi0.1 in single-SPI "B" mode). When the
# HAT is present, USB adapters are allocated from can_s2 upward and any old
# /etc/can_port_map entry pointing a USB port at can_s0/can_s1 is reassigned.
# The MCP2518FD is a native ISO CAN FD controller and the driver enables
# transceiver delay compensation automatically, so the gs_usb FD caveats
# below do not apply to it.
#
# The naming loop runs twice: a swap rename can move an interface the
# glob already passed over, and the second pass picks it up.
#
# Why not CAN FD by default: CTRE supports CAN FD on all current Phoenix 6
# devices (TalonFX, Kraken, CANcoder, Pigeon 2, CANdle, CANdi, CANrange,
# TalonFXS), but their FD implementation is built around the CANivore
# (their own USB-CAN adapter with an integrated CTRE-authored SocketCAN
# kernel driver). The generic candleLight-style gs_usb adapter we use here
# is exactly the "hobbyist-style SocketCAN-USB product" CTRE built the
# CANivore to replace — CTRE explicitly does not guarantee FD compatibility
# with it. On this rig (gs_usb + CANdle + Phoenix 6 alpha-2), FD at 1M/5M
# OR 1M/2M lets the kernel TX frames but the CANdle never acts on them.
# Likely causes (not yet bisected): ISO vs non-ISO CAN FD CRC mismatch,
# missing TDC at 2Mbps, or sample-point/SJW mismatch.
# Classic CAN works because CTRE classic-CAN compatibility predates and
# does not depend on the CANivore driver.
#
# Kernel heartbeat (Beta 15+): robot_heartbeat.ko (+ its dependency
# can_sender.ko) creates the /dev/mrccan/* misc devices that MrcCommDaemon,
# iodaemon and ExpansionHubDaemon open, and transmits the robot heartbeat on
# every can_s* netdev that exists at load time. It holds a reference on each
# of those netdevs, so it is loaded only after all five can_s0..can_s4 slots
# exist, and unloaded (after stopping the daemons that hold /dev/mrccan open)
# before any interface is deleted or reshuffled. If the unload fails, vcan
# cleanup is skipped — deleting a netdev the module still references hangs.
# Do NOT install the old Beta 10 /etc/tmpfiles.d/mrccan.conf alongside this:
# a pre-created /dev/mrccan lets MrcCommDaemon create plain files there,
# which then block the module's device nodes.
#
# Type=simple overrides the stock Type=oneshot: this ExecStart runs forever
# (hot-plug monitor), and systemd refuses Restart=always on oneshot units.
#
# Format: can_sN=<classic|fd> [bitrate] [dbitrate]
# If you opt into FD on a gs_usb adapter, verify per device after enabling
# — Phoenix Tuner discovering the device is NOT sufficient (kernel TX may
# climb while the device silently ignores everything).
# Use CTRE-standard FD timing (1Mbps nominal / 2Mbps data) — do NOT use
# 5Mbps data bitrate (bits too short for real transceivers to decode, bus
# immediately goes ERROR-PASSIVE).
[Service]
Type=simple
RemainAfterExit=no
ExecStartPre=
ExecStartPre=-/bin/bash -c '\
  [ -e /sys/module/robot_heartbeat ] || exit 0; \
  echo "Unloading robot_heartbeat before reconfiguring CAN"; \
  systemctl stop robot.service mrccomm.service limelight_iodaemon.service expansionhubdaemon.service; \
  modprobe -r robot_heartbeat can_sender || echo "WARNING: robot_heartbeat still in use, heartbeat bus list will be stale"'
ExecStart=
ExecStart=/bin/bash -c '\
  modprobe gs_usb 2>/dev/null; \
  if [ -e /sys/module/robot_heartbeat ]; then \
    echo "robot_heartbeat still loaded, skipping vcan cleanup"; \
  else \
    for dev in /sys/class/net/can_s*/type; do \
      IFACE=$(basename $(dirname $dev)); \
      [ -e "/sys/class/net/$IFACE/device/driver" ] || ip link delete $IFACE 2>/dev/null; \
    done; \
  fi; \
  echo "Waiting for CAN adapters (30s timeout)..."; \
  for i in $(seq 1 30); do \
    for dev in /sys/class/net/*/type; do \
      [ "$(cat $dev 2>/dev/null)" = "280" ] && break 2; \
    done; \
    sleep 1; \
  done; \
  RESERVED=0; \
  for d in /sys/class/net/*/device/driver; do \
    [ "$(basename "$(readlink -f $d)")" = "mcp251xfd" ] && RESERVED=2; \
  done; \
  [ "$RESERVED" = "2" ] && echo "Waveshare CAN FD HAT detected: can_s0/can_s1 reserved"; \
  MAP=/etc/can_port_map; touch $MAP; \
  for pass in 1 2; do \
    for dev in /sys/class/net/*/type; do \
      [ "$(cat $dev 2>/dev/null)" = "280" ] || continue; \
      IFACE=$(basename $(dirname $dev)); \
      [ -e "/sys/class/net/$IFACE/device/driver" ] || continue; \
      DRV=$(basename "$(readlink -f /sys/class/net/$IFACE/device/driver)"); \
      if [ "$DRV" = "mcp251xfd" ]; then \
        PORT=$(basename "$(readlink -f /sys/class/net/$IFACE/device)"); \
        case $PORT in \
          spi0.0) CAN_IDX=0 ;; \
          spi1.0|spi0.1) CAN_IDX=1 ;; \
          *) echo "$IFACE: MCP2518FD on unexpected SPI device $PORT, leaving unnamed"; continue ;; \
        esac; \
      else \
        PORT=$(basename $(readlink -f /sys/class/net/$IFACE/device/.. 2>/dev/null)); \
        CAN_IDX=$(grep "^$PORT " $MAP 2>/dev/null | cut -d" " -f2); \
        if [ -n "$CAN_IDX" ] && [ "$CAN_IDX" -lt "$RESERVED" ]; then \
          grep -v "^$PORT " $MAP > $MAP.tmp; mv $MAP.tmp $MAP; \
          echo "Port $PORT was mapped to HAT slot can_s$CAN_IDX, reassigning"; \
          CAN_IDX=; \
        fi; \
        if [ -z "$CAN_IDX" ]; then \
          MAX=$(cut -d" " -f2 $MAP 2>/dev/null | sort -n | tail -1); \
          [ -z "$MAX" ] && MAX=-1; \
          [ "$MAX" -lt "$((RESERVED - 1))" ] && MAX=$((RESERVED - 1)); \
          CAN_IDX=$((MAX + 1)); \
          echo "$PORT $CAN_IDX" >> $MAP; \
          echo "New port $PORT mapped to can_s$CAN_IDX"; \
        fi; \
      fi; \
      [ "$IFACE" = "can_s$CAN_IDX" ] && continue; \
      ip link set $IFACE down 2>/dev/null; \
      ip link set "can_s$CAN_IDX" down 2>/dev/null; \
      ip link set "can_s$CAN_IDX" name "_can_swap" 2>/dev/null; \
      ip link set $IFACE name "can_s$CAN_IDX" && echo "Renamed $IFACE -> can_s$CAN_IDX ($DRV $PORT)"; \
      ip link set "_can_swap" name "$IFACE" 2>/dev/null; \
    done; \
  done; \
  IFACES=$(ls -d /sys/class/net/can_s* 2>/dev/null | xargs -n1 basename); \
  FD_CFG=/etc/can_bus_mode; \
  if [ -n "$IFACES" ]; then \
    for iface in $IFACES; do \
      echo "Configuring $iface..."; \
      ip link set $iface down 2>/dev/null; \
      MODE_LINE=$(grep "^$iface=" $FD_CFG 2>/dev/null | head -1 | cut -d= -f2-); \
      MODE=$(echo $MODE_LINE | cut -d" " -f1); \
      BR=$(echo $MODE_LINE | cut -d" " -f2); \
      DBR=$(echo $MODE_LINE | cut -d" " -f3); \
      DRV=$(basename "$(readlink -f /sys/class/net/$iface/device/driver)"); \
      DEF_MODE=classic; [ "$DRV" = "mcp251xfd" ] && DEF_MODE=fd; \
      [ -z "$MODE" ] && MODE=$DEF_MODE; \
      [ -z "$BR" ] && BR=1000000; \
      [ -z "$DBR" ] && DBR=2000000; \
      if [ "$MODE" = "fd" ] && ip link set $iface type can bitrate $BR sample-point 0.875 dbitrate $DBR dsample-point 0.750 fd on 2>/dev/null; then \
        echo "$iface: CAN FD ($BR / $DBR)"; \
      else \
        ip link set $iface type can bitrate $BR sample-point 0.875 fd off 2>/dev/null; \
        echo "$iface: classic CAN ($BR)"; \
      fi; \
      if [ "$DRV" = "mcp251xfd" ]; then \
        ethtool -G $iface rx 32 tx 8 2>/dev/null; \
        ethtool -C $iface rx-frames-irq 16 rx-usecs-irq 500 2>/dev/null; \
      fi; \
      ip link set $iface txqueuelen 1000; \
      ip link set $iface up; \
    done; \
    sleep 1; \
    for iface in $IFACES; do \
      cansend $iface 000#00 && echo "CAN discovery frame sent on $iface" || echo "cansend failed on $iface"; \
    done; \
  else \
    echo "No CAN adapters found after 30s"; \
  fi; \
  modprobe vcan 2>/dev/null; \
  for n in 0 1 2 3 4; do \
    [ -e "/sys/class/net/can_s$n" ] && continue; \
    ip link add dev can_s$n type vcan 2>/dev/null && ip link set can_s$n up 2>/dev/null && echo "Added vcan placeholder can_s$n (no physical adapter)"; \
  done; \
  if [ ! -e /sys/module/robot_heartbeat ]; then \
    modprobe robot_heartbeat && echo "Loaded robot_heartbeat (heartbeat on can_s0..can_s4, /dev/mrccan devices)"; \
  fi; \
  modprobe i2c-dev 2>/dev/null; \
  systemctl --no-block start mrccomm.service limelight_iodaemon.service expansionhubdaemon.service robot.service; \
  COUNT=$(ls -d /sys/class/net/can_s* 2>/dev/null | wc -l); \
  echo "$COUNT total can_s* interfaces present (USB + vcan placeholders), monitoring..."; \
  while [ "$(ls -d /sys/class/net/can_s* 2>/dev/null | wc -l)" -ge "$COUNT" ]; do sleep 2; done; \
  echo "CAN adapter change detected, restarting..."'
Restart=always
RestartSec=3
